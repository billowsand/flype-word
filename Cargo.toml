[package]
name = "flype-word"
version = "0.1.0"
edition = "2024"
description = "从中文文本生成小鹤双拼词库"
license = "MIT"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.35"
encoding_rs = "0.8.35"
jieba-rs = "0.10"
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
rfd = "0.17"

[profile.release]
lto = "thin"
strip = true
